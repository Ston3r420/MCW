services:
  - type: web
    name: mcw-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set these manually in the Render dashboard:
      # DATABASE_URL       — paste your Neon connection string
      # SESSION_SECRET     — any long random string
      # TWITCH_CLIENT_ID   — from dev.twitch.tv
      # TWITCH_CLIENT_SECRET
      # TWITCH_CALLBACK_URL — https://mcw-backend.onrender.com/auth/twitch/callback
      # FRONTEND_URL        — https://your-project.vercel.app
      # WATCHER_API_KEY     — any secret string
